version: "3.1"

intents:
  - greet
  - demander_faq
  - nlu_fallback

responses:
  utter_greet:
    - text: "Bonjour ! Comment puis-je vous aider aujourd'hui ?"

  utter_default:
    - text: |
        Désolé, je n'ai pas trouvé de réponse à votre question.
        Pouvez-vous reformuler ?

        Exemples de questions :
        - "Quels documents faut-il pour une inscription ?"
        - "Quelles sont les règles en cité universitaire ?"
        - "Comment obtenir un visa ?"

actions:
  - action_hybrid_router
